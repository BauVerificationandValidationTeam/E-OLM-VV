name: Security Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install bandit pip-audit

      - name: Run Bandit
        run: |
          mkdir -p evidence/security
          bandit -r . -x .venv,venv,migrations,static,media -f txt -o evidence/security/bandit.txt || true

      - name: Run pip-audit
        run: |
          mkdir -p evidence/security
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt -f text > evidence/security/pip-audit.txt || true
          else
            pip-audit -f text > evidence/security/pip-audit.txt || true
          fi

      - name: Django check --deploy (if manage.py exists)
        run: |
          mkdir -p evidence/security
          if [ -f manage.py ]; then
            python manage.py check --deploy > evidence/security/django-check-deploy.txt || true
          else
            echo "manage.py not found, skipped" > evidence/security/django-check-deploy.txt
          fi

      - name: Upload security evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: evidence/security
